<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filcher's Shop</title>

  <style>
    body {
      background-color: transparent;
      color: #c9b58b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      text-align: center;
      margin: 8px;
    }

    #quote {
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="quote"></div>

  <script>
    const quotes = [
      "Some things are difficult to find. Others are difficult to explain. I specialize in both.",
      "I find discretion to be a most valuable commodity. Fortunately, I deal in those as well.",
      "One must maintain standards, even in the most unconventional of establishments.",
      "The finest goods are never displayed in the finest shops.",
      "Word travels quickly, I find. Though not nearly as quickly as I can disappear.",
      "It's not much to look at, I grant you, but one shouldn't judge an establishment by its address.",
      "I prefer the term independent acquisitions specialist.",
      "A respectable selection of rather unconventional goods. I trust you'll find something to your liking.",
      "My dear fellow, I assure you that everything is quite in order.",
      "Some treasures are hidden. Others are merely waiting for the right person to acquire them."
    ];

    const quote = quotes[Math.floor(Math.random() * quotes.length)];

    document.getElementById("quote").textContent = quote;
  </script>
</body>
</html>
